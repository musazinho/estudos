<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gadiende com css</title>
    <style>
       /*configurações globais */
         *{
            height: 100%;
         }

         body{
            /* tem como dininuir ou aomentar a cor colocando % como #2E0067 10%, alem que nao use muitas cores para um gadende */
            background-image: linear-gradient(to top, #2E0067, #1D0A33, #8952CC, #C799FF, #E3CCFF); background-attachment: fixed ;
         }

    </style>
</head>
<body>
    <H1>
        testando gradiande
    </H1>
</body>
</html>
