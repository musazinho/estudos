<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>links</title>
    <style>
        body{
            font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
        }
        a {
            color :red;
            text-decoration: none;
            font-weight: bold;
        }
        /* quando o link foi visitado */
        a:visited {
            color: rgb(141, 0, 0);
        }

        /* quando o mouse estiver sobre o link */
        a:hover {
            color : black;
            text-decoration: underline;
        }
        /* quando o link estiver ativo/ quando eu clico */
        a:active {
            color: yellow;
        }
        /* quando todos os links fore usado/clicado 
        rem o before que e antes*/
        .especial::after {
            content: " (link externo)";
            color: rgb(23, 138, 0);
            font-weight: normal;

        }
    </style>
</head>
<body>
    <h1>
        personalizando links com pseudo-classes
    </h1>
    <ol>
        <li><a href="https://github.com/musazinho" target="_blank" class="especial">github</a></li>
        <li><a href="https://www.instagram.com/musarakiz0/" target="_blank" >instagram</a></li>
        <li><a href="https://discord.com/users/1483964802605908019" target="_blank">discord</a></li>
    </ol>
</body>
</html>
