<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Hover</title>
    <style>
        div {
            display: inline-block;
        }
        div > p {
            display: none;
        }
        div:hover > p {
            display: block;
            background-color: red;
            color: thistle;
        }
        div:hover {
           color: red;
        }
    </style>
</head>
<body>
    <h1>Exemplo de Hover</h1>
    <p>
        paser o mouse sobre o texto abaixo para ver a mudança de cor:
    </p>
    <div> 
        passa o mouse aqui
        <p>
            texto escotido
        </p>
    </div>
</body>
</html>
